import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9-SNAPSHOT"
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge { platformPackage = "neoforge" }
}

loom {
    silentMojangMappingsLicense()
    mods { main { sourceSet sourceSets.main } }
}

sourceSets.main.kotlin.srcDirs += "src/main/java"

repositories {
    mavenCentral()
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neo_forge_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
    compileOnly "org.jetbrains:annotations:26.0.2"

    compileOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    compileOnly files("libs/Patchouli-${project.patchouli_version}.jar")
    runtimeOnly files("libs/Patchouli-${project.patchouli_version}.jar")
    compileOnly files("libs/inline-${project.minecraft_version}-${project.inline_version}-neoforge-devruntime.jar")
    runtimeOnly files("libs/inline-${project.minecraft_version}-${project.inline_version}-neoforge-devruntime.jar")
    runtimeOnly files("libs/paucal-${project.paucal_version}+${project.minecraft_version}-neoforge.jar")
    runtimeOnly files("libs/caelus-neoforge-${project.caelus_version}.jar")

    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.kotlin_for_forge_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
    exclude("assets/hexguide/lang/*.flatten.json5")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register("hexGuideStaticContract", Exec) {
    workingDir projectDir
    commandLine(
        "powershell.exe",
        "-NoProfile",
        "-ExecutionPolicy", "Bypass",
        "-File", file("src/test/powershell/hexguide-static-contract.ps1")
    )
}

tasks.named("check") {
    dependsOn tasks.named("hexGuideStaticContract")
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named("sourcesJar", Jar) {
    // A sources archive must never be mistaken for a runnable NeoForge mod.
    exclude("META-INF/neoforge.mods.toml")
    exclude("hexguide-common.mixins.json")
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
